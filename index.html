let pool=[], current=null, score=0, streak=0, asked=0, limit=null, timer=null, timeLeft=null, mode="endless";
function shuffle(arr){ return [...arr].sort(()=>Math.random()-0.5); }
function startGame(){const unit=document.getElementById("unitSelect").value;const type=document.getElementById("typeSelect").value;mode=document.getElementById("modeSelect").value;pool=QUESTIONS.filter(q => (unit==="All" || q.unit===unit) && (type==="All" || q.kind===type));pool=shuffle(pool);score=0;streak=0;asked=0;limit = mode==="timed10" ? 10 : mode==="twenty" ? 20 : null;timeLeft = mode==="timed10" ? 300 : null;document.getElementById("setup").classList.add("hidden");document.getElementById("results").classList.add("hidden");document.getElementById("game").classList.remove("hidden");updateStats();if(timer) clearInterval(timer);if(timeLeft!==null){timer=setInterval(()=>{timeLeft--;updateStats();if(timeLeft<=0) finishGame();},1000);}nextQuestion();}
function updateStats(){document.getElementById("score").textContent=score;document.getElementById("streak").textContent=streak;document.getElementById("counter").textContent= limit ? `${asked}/${limit}` : asked;if(timeLeft===null){document.getElementById("timer").textContent="—";}else{const m=Math.floor(timeLeft/60), s=String(timeLeft%60).padStart(2,"0");document.getElementById("timer").textContent=`${m}:${s}`;}const pct= limit ? Math.min(100,(asked/limit)*100) : Math.min(100, (asked%20)*5);document.getElementById("bar").style.width=pct+"%";}
function nextQuestion(){if(limit && asked>=limit){ finishGame(); return; }if(pool.length===0) pool=shuffle(QUESTIONS);current=pool.pop();asked++;document.getElementById("nextBtn").disabled=true;document.getElementById("feedback").className="feedback";document.getElementById("feedback").innerHTML="";document.getElementById("meta").innerHTML=`<span class="badge">${current.unit}</span><span class="badge">${current.kind}</span><span>${current.family}</span>`;document.getElementById("prompt").textContent=current.prompt;const opts=shuffle(current.options);const box=document.getElementById("options");box.innerHTML="";opts.forEach(opt=>{const b=document.createElement("button");b.className="option";b.textContent=opt;b.onclick=()=>choose(opt,b);box.appendChild(b);});updateStats();}
function choose(opt, btn){const correct= opt===current.answer;[...document.querySelectorAll(".option")].forEach(b=>{b.disabled=true;if(b.textContent===current.answer) b.classList.add("correct");});if(!correct) btn.classList.add("wrong");if(correct){ score++; streak++; }else{ streak=0; }const fb=document.getElementById("feedback");fb.className="feedback show";fb.innerHTML = correct ? `<strong>Correct.</strong> ${current.explanation}` : `<strong>Not quite.</strong> ${current.explanation}<div class="arabic">${current.arabic}</div>`;document.getElementById("nextBtn").disabled=false;updateStats();}
function finishGame(){if(timer) clearInterval(timer);timer=null;document.getElementById("game").classList.add("hidden");document.getElementById("results").classList.remove("hidden");const pct=asked?Math.round(score/asked*100):0;document.getElementById("resultText").innerHTML=`You answered <strong>${score}</strong> out of <strong>${asked}</strong> correctly. Score: <strong>${pct}%</strong>.`;}
function backToSetup(){if(timer) clearInterval(timer);document.getElementById("results").classList.add("hidden");document.getElementById("game").classList.add("hidden");document.getElementById("setup").classList.remove("hidden");}
